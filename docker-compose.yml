# VibOps — Production Docker Compose (100% published images)
# Usage: docker compose up -d
# Console: http://<your-server>:8003

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: vibops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vibops_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibops -d vibops_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vibops_net

# REDIS_PASSWORD has no default on purpose. It used to fall back to
# `vibops-dev`, a password published in this very file at vibops.ai — anyone
# starting the stack without a .env got a Redis protected by a string the whole
# internet could read, and nothing said so. `:?` makes Compose refuse to start
# and name the missing variable, which is the difference between a weak secret
# and a stopped deployment. `install.sh` generates one with `openssl rand`.
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: vibops_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required — generate one with `openssl rand -hex 24`}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required — generate one with `openssl rand -hex 24`}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vibops_net

  # ─── Core API ─────────────────────────────────────────────────────────────

  core:
    image: ghcr.io/davidmacamara-boop/vibops-core@sha256:68f2a7d0489c2107dbb1134297840670570a7b61fcbcf22fd90472933c371676
    container_name: vibops_core
    restart: unless-stopped
    command: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vibops:${POSTGRES_PASSWORD}@postgres:5432/vibops_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required — generate one with `openssl rand -hex 24`}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Boucle locale seulement, comme `agent` juste en dessous.
    #
    # core n'etait publie sur aucun port, et tout passe par Caddy — qui route
    # vers la console ; la console, elle, ne relaie pas /api/v1/health. Donc
    # l'etape 4 du manuel (`curl http://localhost:8000/api/v1/health`) et
    # `make check` echouaient sur une installation parfaitement saine, et
    # `make quickstart` sortait en erreur apres avoir tout demarre. L'hote de
    # demo portait meme un conteneur `socat` dedie pour contourner ca.
    #
    # 127.0.0.1 et non 0.0.0.0 : rien de nouveau n'est expose au reseau, c'est
    # le meme traitement que postgres, agent, prometheus et grafana dans ce
    # fichier. Constate le 01/10/2026 en deroulant Option B sur un hote amd64.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vibops_net

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.2@sha256:083bd0ed8783e366d745f332f0e4489816dd35d984bef8f16e6d89484a22c082
    container_name: vibops_docker_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      BUILD: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      # Le proxy repond a /_ping, autorise par defaut. Sans lui, `worker`
      # demarrait parfois avant que haproxy accepte les connexions et son
      # premier docker_build echouait sur un refus de connexion.
      test: ["CMD-SHELL", "wget -q -O/dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vibops_net

  # ─── Worker + Beat ────────────────────────────────────────────────────────

  worker:
    image: ghcr.io/davidmacamara-boop/vibops-worker@sha256:96429f2514ab6b7504303bc34521eb1ae56099b7004524d99bd86064d0a6cd75
    container_name: vibops_worker
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vibops:${POSTGRES_PASSWORD}@postgres:5432/vibops_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required — generate one with `openssl rand -hex 24`}@redis:6379/0
      DOCKER_HOST: tcp://docker-proxy:2375
      # Le worker s'enregistre lui-meme comme passerelle. Sans ces deux lignes
      # il le fait sous son hostname — l'identifiant du conteneur — et garde son
      # identite dans un fichier qu'aucun volume ne conserve : chaque
      # `--force-recreate` laisse une passerelle orpheline de plus dans la
      # console, nommee d'apres un conteneur mort. Sept sur la demo au 27/09/2026.
      GATEWAY_NAME: ${GATEWAY_NAME:-vibops-worker}
      VIBOPS_DATA_DIR: /var/lib/vibops
    volumes:
      - worker_data:/var/lib/vibops
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # « Pret » pour un worker Celery, c'est repondre au broker — pas avoir un
      # processus. `inspect ping` fait l'aller-retour complet par Redis, donc il
      # echoue aussi quand le broker est injoignable, ce qui est exactement
      # l'etat ou le worker ne sert a rien.
      #
      # Le module est `app.workers.celery_app`. `app.celery_app` n'existe pas —
      # c'est le chemin que portait tests/e2e/test_00_install.py, ou il faisait
      # sauter le test a chaque execution.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    networks:
      - vibops_net

  beat:
    image: ghcr.io/davidmacamara-boop/vibops-core@sha256:68f2a7d0489c2107dbb1134297840670570a7b61fcbcf22fd90472933c371676
    container_name: vibops_beat
    restart: unless-stopped
    command: ["beat"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vibops:${POSTGRES_PASSWORD}@postgres:5432/vibops_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required — generate one with `openssl rand -hex 24`}@redis:6379/0
    depends_on:
      - redis
      - worker
    healthcheck:
      # beat n'a ni port ni `inspect`. Ce qui se verifie est qu'il *bat* :
      # le planificateur persistant reecrit son fichier toutes les trois
      # minutes environ (mesure : 13:29:02 puis 13:32). Dix minutes laissent la
      # marge, et distinguent un beat fige d'un beat vivant — ce qu'un simple
      # « le processus existe » ne fait pas.
      #
      # `| grep -q .` parce que `find` rend 0 meme sans resultat : sans lui la
      # sonde reussirait sur un fichier vieux d'un mois.
      test: ["CMD-SHELL", "find /app/celerybeat-schedule -mmin -10 | grep -q . || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - vibops_net

  # ─── Backup ───────────────────────────────────────────────────────────────

  backup:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: vibops_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    # L'attente du schema avant le premier dump n'est pas une precaution : sans
    # elle, la premiere sauvegarde de toute installation neuve est vide.
    #
    # `depends_on: postgres: service_healthy` est satisfait des que PostgreSQL
    # accepte des connexions — soit avant que core n'ait applique ses
    # migrations. La boucle dumpait donc immediatement, puis dormait 24 h. Le
    # fichier porte la date du jour : il restait vide jusqu'a ce que la
    # retention le supprime, trente jours plus tard. Mesure le 01/10/2026 sur
    # une installation option A : 371 octets compresses, 643 decompresses,
    # l'en-tete de pg_dump sans une seule table — a cote d'un dump manuel de
    # 176 Ko pris quelques minutes apres.
    #
    # Et il se presentait comme une sauvegarde : `make backup-list` l'affichait,
    # et le healthcheck ci-dessous le validait. Le premier jour d'un pilote est
    # celui ou l'on casse le plus de choses, et c'etait le jour sans filet.
    entrypoint: >
      sh -c '
        until [ "$$(psql -h postgres -U vibops -d vibops_db -tAc "select count(*) from alembic_version" 2>/dev/null)" = "1" ]; do
          echo "backup: en attente du schema (migrations en cours)...";
          sleep 10;
        done;
        echo "backup: schema present, premiere sauvegarde";
        while true; do
          STAMP=$$(date -u +%Y-%m-%d);
          pg_dump -h postgres -U vibops -d vibops_db | gzip > /backups/vibops_$${STAMP}.sql.gz;
          pg_dumpall -h postgres -U vibops --globals-only --no-role-passwords | gzip > /backups/globals_$${STAMP}.sql.gz;
          find /backups -name "vibops_*.sql.gz" -mtime +30 -delete;
          find /backups -name "globals_*.sql.gz" -mtime +30 -delete;
          sleep 86400;
        done
      '
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # « Pret » pour une boucle de sauvegarde, c'est avoir produit une
      # sauvegarde. Le conteneur dort 24 h entre deux dumps : deux jours de
      # tolerance couvrent un redemarrage sans masquer une boucle cassee — un
      # mot de passe errone laisse le processus vivant et /backups vide, etat
      # que « Up » ne distingue pas d'un fonctionnement normal.
      #
      # Les deux fichiers sont exiges, pas seulement le dump de la base. Sans
      # les globals, une restauration sur un cluster neuf echoue 57 fois sur
      # `role "vibops_app" does not exist` — et psql sort quand meme en 0
      # (exercice du 25/09/2026, ADR 0048). Une sauvegarde a moitie utilisable
      # doit se voir avant l'incident, pas pendant.
      #
      # La presence du fichier ne suffit pas : ce test passait sur un dump de
      # 643 octets ne contenant aucune table. Il exige donc maintenant que le
      # dump recent porte un CREATE TABLE — c'est la difference entre « un
      # fichier existe » et « une sauvegarde existe ».
      test: ["CMD-SHELL", "D=$$(find /backups -name 'vibops_*.sql.gz' -mtime -2 | sort | tail -1); [ -n \"$$D\" ] && zcat \"$$D\" | grep -qm1 'CREATE TABLE' && find /backups -name 'globals_*.sql.gz' -mtime -2 | grep -q . || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - vibops_net

  # ─── Agent ────────────────────────────────────────────────────────────────

  agent:
    image: ghcr.io/davidmacamara-boop/vibops-agent@sha256:f53bcf59742fdc27086e36d42ef129f94d10758e240f7d37b453eb5542aad7c7
    container_name: vibops_agent
    restart: unless-stopped
    env_file: .env
    environment:
      CORE_API_URL: http://core:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      # `/` rend 46 octets d'identification du service — deja present, rien a
      # ajouter cote application. start_period genereux : l'agent charge son
      # catalogue d'outils dynamique au demarrage.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vibops_net

  # ─── Console ──────────────────────────────────────────────────────────────

  console:
    image: ghcr.io/davidmacamara-boop/vibops-console@sha256:0dc0f1260cabb6613d01b35349c14226f284cfa60d488c0f9662c13f8d875372
    container_name: vibops_console
    restart: unless-stopped
    env_file: .env
    environment:
      CORE_API_URL: http://core:8000
      AGENT_API_URL: http://agent:8001
    volumes:
      - console_data:/data
    # Sans lui, console est « Up » des que le processus existe, avant
    # qu'uvicorn serve : `docker compose up -d` rend la main sur une console
    # qui repond par une reponse vide. `/api/health` existe deja et est
    # publique ; il manquait seulement que le compose la sonde. urllib plutot
    # que curl, absent de l'image.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/api/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      core:
        condition: service_healthy
      agent:
        condition: service_started
    networks:
      - vibops_net

  # ─── LLM Proxy ───────────────────────────────────────────────────────────

  llm-proxy:
    image: ghcr.io/davidmacamara-boop/vibops-llm-proxy@sha256:73ee9a435ebf3bf11e49ec61670f59d2716030c5fc0989c4493b85fd0ba539b1
    container_name: vibops_llm_proxy
    restart: unless-stopped
    environment:
      CORE_API_URL: http://core:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vibops_net

  # ─── Reverse Proxy ───────────────────────────────────────────────────────

  caddy:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    container_name: vibops_caddy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - console
      - core
    healthcheck:
      # L'API d'admin, sur 127.0.0.1 et non `localhost` : elle n'ecoute qu'en
      # IPv4, et `localhost` resout d'abord en ::1 dans cette image — wget y
      # recoit un refus de connexion. Verifie sur caddy:2-alpine.
      test: ["CMD-SHELL", "wget -q -O/dev/null --timeout=5 http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vibops_net

  # ─── Prometheus + Grafana ─────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.4.0@sha256:78ed1f9050eb9eaf766af6e580230b1c4965728650e332cd1ee918c0c4699775
    container_name: vibops_prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O/dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vibops_net

  grafana:
    image: grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    container_name: vibops_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required — generate one with `openssl rand -base64 16`}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O/dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vibops_net

volumes:
  postgres_data:
  backups:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  console_data:
  worker_data:

networks:
  vibops_net:
    driver: bridge
