# VibOps — Production Docker Compose (100% published images)
# Usage: docker compose up -d
# Console: http://<your-server>:8003

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: vibops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vibops_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibops -d vibops_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vibops_net

  redis:
    image: redis:7-alpine
    container_name: vibops_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-vibops-dev}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vibops-dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vibops_net

  # ─── Core API ─────────────────────────────────────────────────────────────

  core:
    image: ghcr.io/davidmacamara-boop/vibops-core:${VIBOPS_VERSION:-v0.41.2}
    container_name: vibops_core
    restart: unless-stopped
    command: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vibops:${POSTGRES_PASSWORD}@postgres:5432/vibops_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-vibops-dev}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vibops_net

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    container_name: vibops_docker_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      BUILD: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vibops_net

  # ─── Worker + Beat ────────────────────────────────────────────────────────

  worker:
    image: ghcr.io/davidmacamara-boop/vibops-worker:${VIBOPS_VERSION:-v0.41.2}
    container_name: vibops_worker
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vibops:${POSTGRES_PASSWORD}@postgres:5432/vibops_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-vibops-dev}@redis:6379/0
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibops_net

  beat:
    image: ghcr.io/davidmacamara-boop/vibops-core:${VIBOPS_VERSION:-v0.41.2}
    container_name: vibops_beat
    restart: unless-stopped
    command: ["beat"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vibops:${POSTGRES_PASSWORD}@postgres:5432/vibops_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-vibops-dev}@redis:6379/0
    depends_on:
      - redis
      - worker
    networks:
      - vibops_net

  # ─── Backup ───────────────────────────────────────────────────────────────

  backup:
    image: postgres:16-alpine
    container_name: vibops_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c '
        while true; do
          STAMP=$$(date -u +%Y-%m-%d);
          DEST=/backups/vibops_$${STAMP}.sql.gz;
          pg_dump -h postgres -U vibops -d vibops_db | gzip > $$DEST;
          find /backups -name "vibops_*.sql.gz" -mtime +30 -delete;
          sleep 86400;
        done
      '
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vibops_net

  # ─── Agent ────────────────────────────────────────────────────────────────

  agent:
    image: ghcr.io/davidmacamara-boop/vibops-agent:${VIBOPS_VERSION:-v0.41.2}
    container_name: vibops_agent
    restart: unless-stopped
    env_file: .env
    environment:
      CORE_API_URL: http://core:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      core:
        condition: service_healthy
    networks:
      - vibops_net

  # ─── Console ──────────────────────────────────────────────────────────────

  console:
    image: ghcr.io/davidmacamara-boop/vibops-console:${VIBOPS_VERSION:-v0.41.2}
    container_name: vibops_console
    restart: unless-stopped
    env_file: .env
    environment:
      CORE_API_URL: http://core:8000
      AGENT_API_URL: http://agent:8001
    depends_on:
      core:
        condition: service_healthy
      agent:
        condition: service_started
    networks:
      - vibops_net

  # ─── LLM Proxy ───────────────────────────────────────────────────────────

  llm-proxy:
    image: ghcr.io/davidmacamara-boop/vibops-llm-proxy:${VIBOPS_VERSION:-v0.41.2}
    container_name: vibops_llm_proxy
    restart: unless-stopped
    environment:
      CORE_API_URL: http://core:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      core:
        condition: service_healthy
    networks:
      - vibops_net

  # ─── Reverse Proxy ───────────────────────────────────────────────────────

  caddy:
    image: caddy:2-alpine
    container_name: vibops_caddy
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/static:ro
    depends_on:
      - console
      - core
    networks:
      - vibops_net

  # ─── Prometheus + Grafana ─────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: vibops_prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - vibops_net

  grafana:
    image: grafana/grafana:11.6.0
    container_name: vibops_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-vibops}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - vibops_net

volumes:
  postgres_data:
  backups:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  vibops_net:
    driver: bridge
